# Sensing Voxel - Default Configuration
# Copy to config/local.yaml and override values as needed

# Debug mode
debug: false

# Telegram Bot Configuration
telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  allowed_users:
    - 100000001  # Replace with an authorized Telegram user ID
  approval_timeout_seconds: 600      # 10 minutes

# Klipper/Moonraker Configuration (optional)
# Uncomment and configure if using Klipper
# klipper:
#   host: "192.0.2.10"
#   port: 7125
#   api_key: "replace-with-moonraker-api-key"
#   base_url: "http://printer.example.test"  # Override host:port with full URL
#   ws_reconnect_max_attempts: 10
#   ws_reconnect_base_delay: 1.0
#   ws_reconnect_max_delay: 30.0
#   ws_reconnect_factor: 1.8
#   ws_reconnect_jitter: 0.25
#   compatibility_mode: false
#   build_plate_surface: "textured PEI"  # Required for print confirmation
#   hotend_nozzle_size_mm: 0.6            # Required for print confirmation

# Bambu Printer Configuration (optional)
# Uncomment and configure if using Bambu printers
# bambu:
#   mqtt_host: "192.0.2.11"
#   mqtt_port: 1883
#   mqtt_username: "bblp"
#   mqtt_password: "replace-with-mqtt-password"
#   ftp_host: "192.0.2.11"
#   ftp_port: 21
#   ftp_username: "root"
#   ftp_password: "replace-with-ftp-password"
#   mqtt_reconnect_max_attempts: 10
#   mqtt_reconnect_base_delay: 1.0
#   mqtt_reconnect_max_delay: 30.0
#   build_plate_surface: "textured PEI"  # Required for print confirmation
#   hotend_nozzle_size_mm: 0.4            # Required for print confirmation

# Camera Configuration (optional)
# Uncomment and configure if using camera monitoring
# camera:
#   rtsp_url: "rtsp://camera-user:camera-password@192.0.2.20:554/stream1"
#   calibration_expiry_days: 30
#   frame_width: 1920
#   frame_height: 1080
#   fps: 10

# Tapo Camera PTZ Configuration (optional)
# Uncomment and configure for camera pan/tilt control
# tapo_camera:
#   host: "192.0.2.20"
#   user: "camera-user"
#   password: "replace-with-camera-password"

# Slicer Configuration
slicer:
  prusaslicer_path: "prusa-slicer"
  profile_path: null
  output_dir: "data/sliced"

# Dashboard Configuration (optional)
# Uncomment to enable the web dashboard
# dashboard:
#   enabled: true
#   host: "0.0.0.0"
#   port: 8080
#   api_token: null            # Set a token to require Bearer auth (null = no auth)
#   camera_rtsp_url: null      # RTSP URL for MJPEG camera proxy
#   camera_mjpeg_fps: 5
#   camera_mjpeg_quality: 80

# LLM Configuration (AI assistant)
# Configure in config/local.yaml with your API key
# llm:
#   provider: minimax          # "minimax" or "ollama"
#   api_key: null             # Set in config/local.yaml (NEVER commit) - required for minimax
#   base_url: "https://api.anthropic.com"  # For Ollama: "http://localhost:11434/v1"
#   model: "claude-sonnet-4-20250514"       # For Ollama: "llama3.2" or your local model
#   max_tokens: 2048
#   allowed_gcode_commands: []       # Optional explicit allowlist for raw G-code beyond built-in safe queries
#   temperature: 0.7
#   timeout_seconds: 30
#   max_conversation_turns: 20
#   verbose_tool_use: true     # Send per-tool-use progress messages (default on)
#   enabled: false
#   shell:
#     enabled: false          # Allow the AI to run short bash diagnostics inside the container
#     cwd: "/app"             # Root working directory for bash tool
#     timeout_seconds: 10
#     max_output_chars: 8000
#   web_search:
#     enabled: false          # Requires a SearXNG instance with JSON enabled
#     searxng_url: "http://searxng:8080"
#     timeout_seconds: 10
#     max_results: 5

# Storage Configuration
storage:
  data_dir: "data"
  state_file: "agent_state.json"
  calibration_dir: "calibration"
  models_dir: "models"
  uploads_dir: "uploads"

# 3D Modeling & Photo-to-Print Configuration
# Uncomment to enable photo-to-print pipeline
# modeling:
#   enabled: true
#   image_to_3d:
