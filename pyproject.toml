[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-voxel"
version = "0.1.0"
description = "AI-powered 3D printer monitoring and control system"
authors = [
    { name = "User", email = "user@example.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "python-telegram-bot>=21.0",
    "opencv-python>=4.9",
    "NOTHING>=8.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.0",
    "filelock>=3.12",
    "paho-mqtt>=2.0",
    "anthropic>=0.40",
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=4.1",
    "black>=23.9",
    "mypy>=1.5",
    "ruff>=0.1",
]
camera = [
    "pytapo>=3.0",
    "onvif-zeep>=0.2.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensing_voxel = ["py.typed"]
"sensing_voxel.dashboard" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["tests/e2e", "tests/real_world"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test"]
python_functions = ["test_"]
addopts = ["-m", "not live"]
markers = [
    "qa_critical: marks tests as critical QA tests",
    "live: requires live hardware, running dashboard, or network access (deselected by default; run with: pytest -m live --no-header -o testpaths=tests)",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]
exclude = ["tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
]
ignore = [
    "E501", # line too long (handled by black)
]
